<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour toi, Ophélie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1b1a21; --bg2:#09090c;
    --gold:#c9a45c; --gold-l:#e8cf96; --gold-d:#9c7a3a;
    --paper:#f6efe2; --paper-d:#e9dcc4;
    --wax:#6e1222; --wax-l:#9a2235;
    --ink:#2b2420;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100svh; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 35%, var(--bg1) 0%, var(--bg2) 70%);
    font-family:'Cormorant Garamond', Georgia, serif; color:var(--paper);
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  /* fine gold frame */
  body::before{
    content:""; position:fixed; inset:14px; border:1px solid rgba(201,164,92,.28);
    pointer-events:none; z-index:1;
  }
  body::after{
    content:""; position:fixed; inset:20px; border:1px solid rgba(201,164,92,.12);
    pointer-events:none; z-index:1;
  }

  /* floating hearts */
  .hearts{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .heart{
    position:absolute; bottom:-40px; color:var(--gold); opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(-8deg); opacity:0}
    15%{opacity:var(--o)}
    50%{transform:translateY(-55vh) translateX(var(--dx)) rotate(8deg)}
    85%{opacity:var(--o)}
    100%{transform:translateY(-110vh) translateX(0) rotate(-8deg); opacity:0}
  }

  /* stage */
  .stage{
    position:relative; z-index:2; min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:34px; padding:40px 20px;
    transition:opacity .9s ease, transform .9s ease;
  }
  .stage.away{opacity:0; transform:translateY(40px) scale(.94); pointer-events:none}

  .to{
    text-align:center; letter-spacing:.32em; text-transform:uppercase;
    font-size:13px; color:var(--gold-l); opacity:.85;
  }
  .to strong{
    display:block; margin-top:10px; letter-spacing:0; text-transform:none;
    font-family:'Pinyon Script', cursive; font-weight:400; font-size:52px; color:var(--gold);
    line-height:1;
  }

  /* envelope */
  .envelope{
    --w:min(82vw, 340px);
    position:relative; width:var(--w); height:calc(var(--w) * .66);
    perspective:900px; cursor:pointer;
    filter:drop-shadow(0 22px 30px rgba(0,0,0,.55));
    animation:float 4s ease-in-out infinite;
  }
  .envelope.open{animation:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .env-back{
    position:absolute; inset:0; border-radius:6px;
    background:linear-gradient(160deg, #e6d8bf, #d6c4a4);
  }
  .paper{
    position:absolute; left:7%; width:86%; top:6%; height:86%;
    background:linear-gradient(180deg, #fbf6ec, var(--paper));
    border-radius:3px; z-index:2;
    box-shadow:0 0 0 1px rgba(156,122,58,.25) inset;
    transition:transform .9s cubic-bezier(.3,.7,.2,1);
    display:flex; align-items:flex-start; justify-content:center; padding-top:9%;
  }
  .paper::before{
    content:""; position:absolute; inset:7px; border:1px solid rgba(201,164,92,.55); border-radius:2px;
  }
  .paper span{
    font-family:'Pinyon Script', cursive; font-size:30px; color:var(--gold-d);
  }
  .envelope.slide .paper{transform:translateY(-52%)}

  .pocket{position:absolute; inset:0; z-index:3; pointer-events:none}
  .pocket svg, .flap svg{width:100%; height:100%; display:block}

  .flap{
    position:absolute; left:0; top:0; width:100%; height:62%;
    transform-origin:50% 0; transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.4,.1,.3,1);
    z-index:4; pointer-events:none;
  }
  .envelope.open .flap{transform:rotateX(180deg)}
  .envelope.behind .flap{z-index:1}

  .seal{
    position:absolute; left:50%; top:62%; width:64px; height:64px;
    transform:translate(-50%,-50%); z-index:5;
    transition:transform .45s ease, opacity .45s ease;
  }
  .envelope.open .seal{transform:translate(-50%,-50%) scale(1.25); opacity:0}

  .hint{
    font-style:italic; font-size:18px; color:var(--gold-l); opacity:.75;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .stage.started .hint{animation:none; opacity:0; transition:opacity .4s}

  /* letter */
  .letter-wrap{
    position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    padding:28px 18px; pointer-events:none; overflow-y:auto;
  }
  .letter{
    position:relative; width:min(92vw, 420px); margin:auto;
    background:
      radial-gradient(120% 80% at 50% 0%, #fffaf0 0%, var(--paper) 55%, var(--paper-d) 100%);
    color:var(--ink); border-radius:4px; padding:44px 30px 36px;
    box-shadow:0 30px 60px rgba(0,0,0,.6);
    opacity:0; transform:translateY(60px) scale(.9);
    transition:opacity .9s ease, transform 1s cubic-bezier(.2,.8,.2,1);
    text-align:center;
  }
  .letter::before{content:""; position:absolute; inset:10px; border:1px solid rgba(201,164,92,.75); pointer-events:none}
  .letter::after{content:""; position:absolute; inset:15px; border:1px solid rgba(201,164,92,.3); pointer-events:none}
  .letter-wrap.show{pointer-events:auto}
  .letter-wrap.show .letter{opacity:1; transform:none}

  .orn{width:120px; margin:0 auto; display:block; color:var(--gold)}
  .greet{
    font-family:'Pinyon Script', cursive; font-size:44px; color:var(--gold-d); margin:14px 0 18px; line-height:1.1;
  }
  .body p{font-size:20px; line-height:1.5; margin:0 0 14px}
  .when{
    margin:22px 0 6px; font-size:13px; letter-spacing:.35em; text-transform:uppercase; color:var(--gold-d);
  }
  .big{
    font-size:38px; font-weight:500; line-height:1.1; letter-spacing:.02em; color:var(--ink);
  }
  .big em{display:block; font-size:20px; font-weight:400; margin-top:6px; color:#6b5a48}
  .secret{
    display:inline-block; margin-top:18px; padding:8px 18px; border:1px solid rgba(201,164,92,.7);
    font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-d);
  }
  .love{
    font-family:'Pinyon Script', cursive; font-size:38px; color:var(--gold-d); margin-top:26px; line-height:1;
  }
  .love span{color:var(--wax-l); font-family:'Cormorant Garamond', serif; font-size:28px; vertical-align:middle}
  .sign{
    font-family:'Pinyon Script', cursive; font-size:40px; color:var(--wax); margin-top:10px; line-height:1;
  }
  .sign-sub{
    font-style:italic; font-size:19px; color:#6b5a48; margin-top:4px; letter-spacing:.03em;
  }
  .replay{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:6;
    background:none; border:none; color:var(--gold-l); opacity:0; font-family:inherit;
    font-size:15px; font-style:italic; letter-spacing:.05em; cursor:pointer;
    transition:opacity 1s ease 2s; pointer-events:none;
  }
  .replay.show{opacity:.55; pointer-events:auto}

  canvas#confetti{position:fixed; inset:0; width:100%; height:100%; z-index:7; pointer-events:none}

  @media (max-height:640px){
    .letter{padding:36px 24px 28px}
    .greet{font-size:38px; margin:8px 0 12px}
    .body p{font-size:18px}
    .big{font-size:32px}
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<main class="stage" id="stage">
  <div class="to">Pour toi<strong>Ophélie</strong></div>

  <div class="envelope" id="envelope" role="button" aria-label="Ouvrir l'enveloppe" tabindex="0">
    <div class="env-back"></div>

    <div class="paper"><span>Ophélie</span></div>

    <div class="pocket">
      <svg viewBox="0 0 340 224" preserveAspectRatio="none">
        <defs>
          <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3e9d7"/>
            <stop offset="1" stop-color="#e4d4b6"/>
          </linearGradient>
          <linearGradient id="pkSide" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ebdfc8"/>
            <stop offset="1" stop-color="#f1e6d2"/>
          </linearGradient>
        </defs>
        <!-- left & right side folds -->
        <path d="M0 0 L170 128 L0 224 Z" fill="url(#pkSide)"/>
        <path d="M340 0 L170 128 L340 224 Z" fill="#efe3cd"/>
        <!-- bottom fold -->
        <path d="M0 224 L170 112 L340 224 Z" fill="url(#pk)"/>
        <!-- gold fold lines -->
        <path d="M0 224 L170 112 L340 224" fill="none" stroke="#c9a45c" stroke-width="1.2" opacity=".8"/>
        <path d="M0 0 L136 102 M340 0 L204 102" fill="none" stroke="#c9a45c" stroke-width="1" opacity=".45"/>
        <path d="M.5 0 V223.5 H339.5 V0" fill="none" stroke="#c9a45c" stroke-width="1" opacity=".7"/>
      </svg>
    </div>

    <div class="flap">
      <svg viewBox="0 0 340 139" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#efe4cf"/>
            <stop offset="1" stop-color="#ddcaa8"/>
          </linearGradient>
        </defs>
        <path d="M0 0 L340 0 L180 134 Q170 141 160 134 Z" fill="url(#fl)"/>
        <path d="M0 0 L160 134 Q170 141 180 134 L340 0" fill="none" stroke="#c9a45c" stroke-width="1.3"/>
      </svg>
    </div>

    <div class="seal">
      <svg viewBox="0 0 64 64">
        <defs>
          <radialGradient id="wx" cx="40%" cy="35%" r="70%">
            <stop offset="0" stop-color="#a8283d"/>
            <stop offset=".6" stop-color="#6e1222"/>
            <stop offset="1" stop-color="#4a0b16"/>
          </radialGradient>
          <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f1dca6"/>
            <stop offset=".5" stop-color="#c9a45c"/>
            <stop offset="1" stop-color="#9c7a3a"/>
          </linearGradient>
        </defs>
        <path d="M32 3 C40 2 47 6 52 11 C58 15 62 22 61 31 C62 40 58 47 52 52 C47 58 40 61 32 61 C23 62 16 58 11 52 C5 47 2 40 3 31 C2 22 6 15 12 10 C17 5 24 2 32 3Z" fill="url(#wx)"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#4a0b16" stroke-width="2" opacity=".6"/>
        <circle cx="32" cy="32" r="19" fill="none" stroke="url(#gd)" stroke-width="1"/>
        <path d="M32 43 C22 36 19 31 19 27 C19 23 22 20.5 25.5 20.5 C28.5 20.5 30.6 22.4 32 24.6 C33.4 22.4 35.5 20.5 38.5 20.5 C42 20.5 45 23 45 27 C45 31 42 36 32 43Z" fill="url(#gd)"/>
      </svg>
    </div>
  </div>

  <div class="hint">Touche l'enveloppe</div>
</main>

<div class="letter-wrap" id="letterWrap">
  <article class="letter">
    <svg class="orn" viewBox="0 0 120 16" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M2 8 H44"/><path d="M76 8 H118"/>
      <path d="M60 2 L66 8 L60 14 L54 8 Z" fill="currentColor"/>
      <circle cx="48" cy="8" r="1.6" fill="currentColor"/><circle cx="72" cy="8" r="1.6" fill="currentColor"/>
    </svg>

    <div class="greet">Ma chère Poupou,</div>

    <div class="body">
      <p>Jeudi soir, ne prévois rien ma chère, parce qu'on va se faire notre petit resto de couple, eheh !</p>
    </div>

    <div class="when">Rendez-vous</div>
    <div class="big">Numa<em>jeudi à 19h15</em></div>

    <div class="love">Je t'aime <span>♥</span></div>

    <div class="sign">Xavier</div>
    <div class="sign-sub">ton poupouille</div>
  </article>
</div>

<button class="replay" id="replay">Rejouer</button>

<canvas id="confetti"></canvas>

<audio id="music" src="treasure.mp3" preload="auto"></audio>

<script>
(function(){
  /* ---------- floating hearts ---------- */
  const hearts = document.getElementById('hearts');
  function addHeart(opts){
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '♥';
    const size = opts.size || (10 + Math.random()*16);
    h.style.left = (Math.random()*100) + 'vw';
    h.style.fontSize = size + 'px';
    h.style.setProperty('--o', opts.o || (0.12 + Math.random()*0.25));
    h.style.setProperty('--dx', ((Math.random()-.5)*60) + 'px');
    h.style.animationDuration = (opts.dur || (12 + Math.random()*10)) + 's';
    h.style.animationDelay = (opts.delay != null ? opts.delay : Math.random()*-20) + 's';
    if (opts.color) h.style.color = opts.color;
    if (opts.once){ h.style.animationIterationCount = 1; h.addEventListener('animationend', ()=>h.remove()); }
    hearts.appendChild(h);
  }
  for (let i=0;i<9;i++) addHeart({});

  /* ---------- confetti ---------- */
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  let W, H, dpr, parts = [], running = false;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize', resize);

  const COLORS = ['#c9a45c','#e8cf96','#f1dca6','#9c7a3a','#f6efe2','#ffffff','#9a2235','#d98a9a','#b87333'];
  function spawn(x, y, n, angle, spread, speed){
    for (let i=0;i<n;i++){
      const a = angle + (Math.random()-.5)*spread;
      const s = speed*(0.45 + Math.random()*0.75);
      parts.push({
        x, y,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        w: 5 + Math.random()*6, h: 8 + Math.random()*8,
        r: Math.random()*Math.PI*2, vr: (Math.random()-.5)*0.3,
        t: Math.random()*Math.PI*2, vt: 0.08 + Math.random()*0.12,
        c: COLORS[(Math.random()*COLORS.length)|0],
        shape: Math.random() < .15 ? 'circle' : (Math.random() < .12 ? 'heart' : 'rect'),
        drag: 0.985 - Math.random()*0.015,
        life: 0
      });
    }
    if (!running){ running = true; requestAnimationFrame(tick); }
  }
  function rain(n, duration){
    const step = duration / n;
    for (let i=0;i<n;i++){
      setTimeout(()=>{
        spawn(Math.random()*W, -20, 1, Math.PI/2, .6, 2 + Math.random()*2);
      }, i*step);
    }
  }
  function drawHeart(s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.bezierCurveTo(-s, -s*0.3, -s*0.45, -s, 0, -s*0.45);
    ctx.bezierCurveTo(s*0.45, -s, s, -s*0.3, 0, s*0.35);
    ctx.fill();
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.vx *= p.drag; p.vy = p.vy*p.drag + 0.16;
      p.vx += Math.sin(p.t)*0.05;
      p.x += p.vx; p.y += p.vy;
      p.r += p.vr; p.t += p.vt; p.life++;
      if (p.y > H + 40 || p.x < -60 || p.x > W + 60){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.scale(1, Math.cos(p.t));
      ctx.fillStyle = p.c;
      if (p.shape === 'circle'){ ctx.beginPath(); ctx.arc(0,0,p.w*0.5,0,Math.PI*2); ctx.fill(); }
      else if (p.shape === 'heart'){ drawHeart(p.w); }
      else { ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      ctx.restore();
    }
    if (parts.length){ requestAnimationFrame(tick); } else { running = false; ctx.clearRect(0,0,W,H); }
  }

  function bigCelebration(cx, cy){
    // central burst
    spawn(cx, cy, 260, -Math.PI/2, Math.PI*1.1, 17);
    // side cannons
    setTimeout(()=>{
      spawn(-10, H*0.85, 160, -Math.PI/3, .7, 22);
      spawn(W+10, H*0.85, 160, -Math.PI*2/3, .7, 22);
    }, 250);
    setTimeout(()=>{ spawn(cx, cy, 140, -Math.PI/2, Math.PI*1.4, 14); }, 650);
    // gentle golden rain
    setTimeout(()=> rain(260, 4500), 900);
    // a few rising pink hearts
    for (let i=0;i<10;i++){
      addHeart({ once:true, size:16+Math.random()*18, o:.55, dur:6+Math.random()*4, delay:i*0.25, color: i%2 ? '#d98a9a' : '#e8cf96' });
    }
  }

  /* ---------- envelope sequence ---------- */
  const env = document.getElementById('envelope');
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('letterWrap');
  const replay = document.getElementById('replay');
  const music = document.getElementById('music');
  let opened = false;

  /* ---------- music (volume via Web Audio, works on iPhone too) ---------- */
  const VOLUME = 0.25;            // 0 = muet, 1 = volume d'origine
  let actx = null, gain = null, started = false;
  function setupAudio(){
    if (actx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      const src = actx.createMediaElementSource(music);
      gain = actx.createGain();
      gain.gain.value = 0;
      src.connect(gain); gain.connect(actx.destination);
    } catch(e){ actx = null; music.volume = VOLUME; }
  }
  function startMusic(){
    if (started) return;
    setupAudio();
    const go = ()=>{
      const p = music.play();
      const ok = ()=>{
        started = true;
        if (gain){
          const t = actx.currentTime;
          gain.gain.cancelScheduledValues(t);
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(VOLUME, t + 2);
        }
        removeGestureListeners();
      };
      if (p && p.then) p.then(ok).catch(()=>{}); else ok();
    };
    if (actx && actx.state === 'suspended'){
      actx.resume().then(()=>{ if (actx.state === 'running') go(); }).catch(()=>{});
    } else { go(); }
  }
  // 1) on tente dès l'arrivée sur la page (bloqué par la plupart des téléphones)
  try {
    setupAudio();
    if (!actx || actx.state === 'running') startMusic();
  } catch(e){}
  // 2) sinon, au tout premier contact avec l'écran, où que ce soit
  const gestureEvents = ['pointerdown','touchstart','click','keydown'];
  function onGesture(){ startMusic(); }
  function removeGestureListeners(){ gestureEvents.forEach(ev => document.removeEventListener(ev, onGesture, true)); }
  gestureEvents.forEach(ev => document.addEventListener(ev, onGesture, true));

  function open(){
    if (opened) return;
    opened = true;
    stage.classList.add('started');
    startMusic();

    env.classList.add('open');                          // seal pops, flap flips
    setTimeout(()=> env.classList.add('behind'), 380);   // flap goes behind the paper
    setTimeout(()=> env.classList.add('slide'), 650);    // paper slides out
    setTimeout(()=>{
      const r = env.getBoundingClientRect();
      bigCelebration(r.left + r.width/2, r.top + r.height*0.2);
      stage.classList.add('away');
      wrap.classList.add('show');
      replay.classList.add('show');
    }, 1500);
  }
  env.addEventListener('click', open);
  env.addEventListener('keydown', e=>{ if (e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });

  replay.addEventListener('click', ()=>{
    wrap.classList.remove('show');
    replay.classList.remove('show');
    setTimeout(()=>{
      env.classList.remove('slide','behind','open');
      stage.classList.remove('away','started');
      opened = false;
    }, 600);
  });
})();
</script>
</body>
</html>
